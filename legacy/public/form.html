<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo justificante - UTXJ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <a href="index.html" class="navbar-brand fw-semibold">&larr; Justificantes UTXJ</a>
    </div>
  </nav>

  <main class="container pb-5" style="max-width: 860px">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span class="fw-semibold" id="titulo">Nuevo justificante</span>
        <span id="folio" class="text-muted small"></span>
      </div>
      <div class="card-body">
        <div id="alerta" class="alert d-none" role="alert"></div>

        <form id="form" class="row g-3" novalidate>
          <div class="col-md-6">
            <label class="form-label" for="matricula">Matricula *</label>
            <input class="form-control" id="matricula" name="matricula" list="estudiantes" required maxlength="20" autocomplete="off">
            <datalist id="estudiantes"></datalist>
            <div class="form-text" id="nombre-estudiante">Selecciona una matricula registrada.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="carrera">Carrera *</label>
            <input class="form-control" id="carrera" name="carrera" required maxlength="120">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="grupo">Grupo *</label>
            <input class="form-control" id="grupo" name="grupo" required maxlength="20">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="fecha_solicitud">Fecha de solicitud *</label>
            <input type="date" class="form-control" id="fecha_solicitud" name="fecha_solicitud" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="fecha_inicio">Fecha de inicio *</label>
            <input type="date" class="form-control" id="fecha_inicio" name="fecha_inicio" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="fecha_fin">Fecha de fin *</label>
            <input type="date" class="form-control" id="fecha_fin" name="fecha_fin" required>
          </div>
          <div class="col-12">
            <label class="form-label" for="materias">Materias afectadas *</label>
            <input class="form-control" id="materias" name="materias" required maxlength="255" placeholder="Ej. Calculo, Programacion Web">
          </div>
          <div class="col-12">
            <label class="form-label" for="motivo">Motivo *</label>
            <textarea class="form-control" id="motivo" name="motivo" rows="3" required maxlength="1000"></textarea>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="caso_critico" name="caso_critico">
              <label class="form-check-label" for="caso_critico">Caso critico (requiere comprobante)</label>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label" for="comprobante">Comprobante medico (PDF, JPG o PNG, max. 5 MB)</label>
            <input type="file" class="form-control" id="comprobante" name="comprobante" accept=".pdf,.jpg,.jpeg,.png">
            <div class="form-text" id="comprobante-actual"></div>
          </div>
          <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary" id="btn-guardar" type="submit">Guardar justificante</button>
            <a href="index.html" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/form.js"></script>
</body>
</html>
