<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión - Justificantes UTXJ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/login.css" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-circle">
          <i class="bi bi-file-earmark-text"></i>
        </div>
        <h1 class="login-title">Justificantes UTXJ</h1>
        <p class="login-subtitle">Sistema de Gestión de Justificantes Académicos</p>
        <p class="university-name">Universidad Tecnológica de Xicotepec de Juárez</p>
      </div>
      
      <div class="login-body">
        <div id="alerta" class="alert d-none" role="alert"></div>
        
        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">
              <i class="bi bi-person"></i> Usuario
            </label>
            <input type="text" class="form-control" id="username" name="username" required autocomplete="username" placeholder="Ingrese su usuario">
          </div>
          
          <div class="mb-4">
            <label for="password" class="form-label">
              <i class="bi bi-lock"></i> Contraseña
            </label>
            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password" placeholder="Ingrese su contraseña">
          </div>
          
          <button type="submit" class="btn-login">
            <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
          </button>
        </form>
        
        <div class="login-footer">
          <div class="users-info">
            <p class="mb-2"><strong>Usuarios de prueba:</strong></p>
            <div class="user-badge">
              <span class="badge-role tutor">Tutor</span> <code>tutor / tutor123</code>
            </div>
            <div class="user-badge">
              <span class="badge-role alumna">Alumna</span> <code>alumna / alumna123</code>
            </div>
            <div class="user-badge">
              <span class="badge-role directora">Directora</span> <code>directora / directora123</code>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
