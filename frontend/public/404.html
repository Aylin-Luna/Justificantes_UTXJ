<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · Justificantes UTXJ</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <main class="print-page" style="display:grid;place-items:center;min-height:100vh">
    <div class="card" style="max-width:560px;width:100%">
      <div class="card-body" style="text-align:center;padding:44px 32px">
        <img src="/assets/img/logo-utxj.svg" alt="UTXJ" style="width:180px;margin:0 auto 24px">
        <p class="page-eyebrow" style="justify-content:center">Error 404</p>
        <h1 style="font-family:var(--font-display);font-size:30px;margin-top:8px">Página no encontrada</h1>
        <p class="muted" style="margin-top:10px;font-size:13.5px">La dirección que intentó abrir no existe o fue movida. Regrese al panel del sistema para continuar.</p>
        <div class="cluster" style="justify-content:center;margin-top:22px">
          <a class="btn btn-primary" href="/app#/inicio">Ir al panel</a>
          <a class="btn btn-secondary" href="/">Iniciar sesión</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
